# Netlify config — this is a static site, no build step needed.
[build]
  publish = "."
  command = ""

# Nice clean URLs and a basic security header set
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
